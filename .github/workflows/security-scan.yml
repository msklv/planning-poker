# Dependency advisory audit via Google osv-scanner / OSV.dev (basic ИБ baseline)
# Reusable workflow uploads SARIF to Code Scanning itself; no manual upload step.
name: "Security scan (osv-scanner)"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    - cron: "19 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  osv-scan:
    name: Dependency audit (osv-scanner / OSV.dev)
    permissions:
      actions: read
      security-events: write
      contents: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
    with:
      scan-args: |-
        --include-git-root
        -r
        ./